<meta charset="utf-8">
<title>이클립스 캐릭터 생성</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: class roster rail | lit stage with the hero art and a live sprite | dossier with stats and the create form */
:root {
  --night: #0f0d0c;
  --slab: #1a1613;
  --slab-2: #241e19;
  --rule: rgba(214, 186, 128, 0.18);
  --ink: #ece2cc;
  --dim: #9c907b;
  --brass: #d6b26a;
  --class: #d6b26a;   /* overwritten per class */
  --display: "Gowun Batang", "Noto Serif KR", serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--ink); font-family: var(--body); font-size: 14px;
  background-image: radial-gradient(1200px 600px at 50% -10%, color-mix(in srgb, var(--class) 14%, transparent), transparent 70%);
  transition: background-image .4s;
}
.wrap {
  max-width: 1280px; margin: 0 auto;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px;
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--rule); padding-bottom: 12px; }
header h1 { margin: 0; font-family: var(--display); font-size: 26px; letter-spacing: .02em; color: var(--brass); }
header p { margin: 0; color: var(--dim); font-size: 13px; }

.main { display: grid; grid-template-columns: 220px minmax(0, 1fr) 340px; gap: 20px; align-items: start; }

/* roster */
.roster { display: grid; gap: 8px; }
.pick {
  display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; text-align: left;
  background: var(--slab); border: 1px solid var(--rule); border-radius: 6px; padding: 6px; color: var(--ink);
  font: inherit; cursor: pointer; transition: border-color .2s, background .2s;
}
.pick img { width: 56px; height: 56px; object-fit: cover; border-radius: 4px; display: block; filter: saturate(.6) brightness(.8); transition: filter .2s; }
.pick b { display: block; font-family: var(--display); font-size: 16px; }
.pick span { font-size: 12px; color: var(--dim); }
.pick:hover img, .pick[aria-pressed="true"] img { filter: none; }
.pick[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--slab)); }
.pick:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

/* stage */
.stage { display: grid; gap: 12px; min-width: 0; }
.hero {
  position: relative; border-radius: 8px; overflow: hidden; background: #000; aspect-ratio: 16 / 10; max-width: 100%;
  border: 1px solid var(--rule);
}
.hero .art {
  position: absolute; left: 0; top: 0; height: 100%; width: 58%; object-fit: cover; object-position: center top;
  -webkit-mask-image: linear-gradient(90deg, #000 70%, transparent); mask-image: linear-gradient(90deg, #000 70%, transparent);
}
.hero .floor {
  position: absolute; right: 0; top: 0; bottom: 0; width: 52%;
  background: radial-gradient(60% 18% at 50% 80%, color-mix(in srgb, var(--class) 30%, transparent), transparent 70%);
}
.hero canvas { position: absolute; right: 0; bottom: 0; width: 52%; height: 100%; image-rendering: pixelated; }
.hero .tag {
  position: absolute; left: 16px; bottom: 14px; display: grid; gap: 2px; text-shadow: 0 2px 8px #000;
}
.hero .tag em { font-style: normal; font-size: 12px; letter-spacing: .14em; color: var(--class); }
.hero .tag strong { font-family: var(--display); font-size: 34px; line-height: 1.1; }

.controls { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
  background: var(--slab); color: var(--dim); border: 1px solid var(--rule);
}
.chip[aria-pressed="true"] { color: var(--night); background: var(--class); border-color: var(--class); font-weight: 700; }
.controls .sep { width: 1px; background: var(--rule); margin: 0 4px; }

.strip { background: var(--slab); border: 1px solid var(--rule); border-radius: 8px; padding: 12px; display: grid; gap: 8px; }
.strip h3 { margin: 0; font-size: 12px; letter-spacing: .12em; color: var(--dim); font-weight: 500; }
.strip .skillart { display: block; width: 100%; max-width: 560px; height: auto; image-rendering: pixelated; }
.strip .skillname { font-family: var(--display); font-size: 18px; color: var(--class); }
.strip p { margin: 0; color: var(--ink); line-height: 1.6; }

/* dossier */
.dossier { display: grid; gap: 14px; min-width: 0; }
.card { background: var(--slab); border: 1px solid var(--rule); border-radius: 8px; padding: 16px; display: grid; gap: 12px; }
.card h2 { margin: 0; font-family: var(--display); font-size: 20px; text-wrap: balance; }
.card .lede { margin: 0; color: var(--dim); line-height: 1.65; }
.label { font-size: 12px; letter-spacing: .12em; color: var(--dim); }
.stats { display: grid; gap: 8px; }
.stat { display: grid; grid-template-columns: 56px 1fr 20px; gap: 10px; align-items: center; font-size: 13px; }
.stat .bar { height: 6px; background: var(--slab-2); border-radius: 3px; overflow: hidden; }
.stat .bar i { display: block; height: 100%; background: var(--class); border-radius: 3px; transition: width .35s; }
.stat b { font-variant-numeric: tabular-nums; text-align: right; color: var(--class); }
.weapons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.weapons div { background: var(--slab-2); border: 1px solid var(--rule); border-radius: 4px; height: 76px; display: grid; place-items: center; padding: 4px; }
.weapons img { max-height: 68px; max-width: 100%; }

form { display: grid; gap: 10px; }
form label { font-size: 12px; letter-spacing: .12em; color: var(--dim); }
form input {
  font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 6px; width: 100%;
  background: var(--night); color: var(--ink); border: 1px solid var(--rule);
}
form .hint { font-size: 12px; color: var(--dim); min-height: 1.2em; margin: 0; }
form .hint.err { color: #e7766c; }
.create {
  font: inherit; font-weight: 700; font-size: 16px; padding: 12px; border-radius: 6px; cursor: pointer; border: 0;
  background: linear-gradient(180deg, color-mix(in srgb, var(--class) 90%, #fff), var(--class)); color: var(--night);
}

.made { display: grid; gap: 8px; }
.made ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.made li { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; background: var(--slab-2); border-radius: 6px; padding: 6px; }
.made li img { width: 36px; height: 36px; object-fit: cover; border-radius: 4px; }
.made li span { font-size: 12px; color: var(--dim); }
.made li button { font: inherit; font-size: 12px; background: none; border: 1px solid var(--rule); color: var(--dim); border-radius: 4px; padding: 2px 8px; cursor: pointer; }
.made .empty { color: var(--dim); font-size: 13px; margin: 0; }

@media (max-width: 1080px) {
  .main { grid-template-columns: 1fr; }
  .roster { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .roster { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .hero { aspect-ratio: 4 / 5; }
  .hero .art { width: 100%; height: 62%; -webkit-mask-image: linear-gradient(180deg, #000 70%, transparent); mask-image: linear-gradient(180deg, #000 70%, transparent); }
  .hero .floor, .hero canvas { width: 100%; height: 55%; top: auto; }
  .hero .tag { bottom: auto; top: 14px; }
  .hero .tag strong { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>캐릭터 생성</h1>
    <p>직업을 고르고 동작을 확인한 뒤 이름을 지어 주세요.</p>
  </header>

  <div class="main">
    <nav class="roster" id="roster" aria-label="직업 선택"></nav>

    <section class="stage">
      <div class="hero">
        <img class="art" id="art" alt="">
        <div class="floor"></div>
        <canvas id="cv" width="320" height="300" aria-label="캐릭터 동작 미리보기"></canvas>
        <div class="tag"><em id="role"></em><strong id="cname"></strong></div>
      </div>
      <div class="controls" id="anims" role="group" aria-label="동작"></div>
      <div class="strip">
        <h3>대표 스킬</h3>
        <div class="skillname" id="skname"></div>
        <img class="skillart" id="skart" alt="">
        <p id="skdesc"></p>
      </div>
    </section>

    <aside class="dossier">
      <div class="card">
        <h2 id="title"></h2>
        <p class="lede" id="lede"></p>
        <div class="label">능력치</div>
        <div class="stats" id="stats"></div>
        <div class="label">무기</div>
        <div class="weapons" id="weapons"></div>
      </div>
      <div class="card">
        <form id="form" novalidate>
          <label for="nick">캐릭터 이름</label>
          <input id="nick" maxlength="12" autocomplete="off" placeholder="2~12자, 한글·영문·숫자">
          <p class="hint" id="hint"></p>
          <button class="create" type="submit" id="go">생성하기</button>
        </form>
      </div>
      <div class="card made">
        <div class="label">내 캐릭터</div>
        <ul id="list"></ul>
        <p class="empty" id="empty">아직 만든 캐릭터가 없습니다.</p>
      </div>
    </aside>
  </div>
</div>

  const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  const W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  cx.clearRect(0, 0, W, H);
  cx.imageSmoothingEnabled = false;
  const info = M[cur.id].anims[anim];
  const el = (now - t0) / 1000;
  let f = reduce ? 0 : Math.floor(el * SPEED[anim]);
  f = anim === 'death' ? Math.min(f, info.n - 1) : f % info.n;
  if (anim === 'death' && el > 2.4) t0 = now;
  const im = img(`${BASE}${cur.id}/${anim}_${f}.png`);
  if (im.complete && im.naturalWidth) {
    const s = Math.max(2, Math.floor(H * 0.62 / info.h));
    const [ax, foot] = info.anchor[f];
    const footY = H * 0.84;
    // shadow
    cx.fillStyle = 'rgba(0,0,0,.45)';
    cx.beginPath(); cx.ellipse(W / 2, footY, 16 * s, 4 * s, 0, 0, Math.PI * 2); cx.fill();
    const bob = anim === 'idle' && !reduce ? Math.round(Math.sin(el * 3) * 0.5) * s : 0;
    cx.drawImage(im, Math.round(W / 2 - ax * s), Math.round(footY - (foot + 1) * s + bob), im.naturalWidth * s, im.naturalHeight * s);
  }
  requestAnimationFrame(draw);
}

// creation (kept in this browser only)
const KEY = 'eclipse.cc.roster';
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
function save(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); return true; } catch (e) { return false; } }
let roster = load();
function render() {
  $('list').innerHTML = '';
  roster.forEach((ch, i) => {
    const k = CLASSES.find(c => c.id === ch.cls);
    const li = document.createElement('li');
    li.innerHTML = `<img src="${BASE}${k.id}/face.png" alt=""><div><b></b><br><span>${k.name} · Lv.1</span></div><button type="button">삭제</button>`;
    li.querySelector('b').textContent = ch.name;
    li.querySelector('button').onclick = () => { roster.splice(i, 1); save(roster); render(); };
    li.querySelector('img').onclick = () => select(k);
    $('list').append(li);
  });
  $('empty').hidden = roster.length > 0;
}
$('form').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('nick').value.trim(), hint = $('hint');
  hint.classList.add('err');
  if (!/^[가-힣A-Za-z0-9]{2,12}$/.test(name)) { hint.textContent = '이름은 한글·영문·숫자 2~12자로 지어 주세요. 띄어쓰기와 기호는 쓸 수 없습니다.'; return; }
  if (roster.some(c => c.name === name)) { hint.textContent = '이미 같은 이름의 캐릭터가 있습니다.'; return; }
  if (roster.length >= 6) { hint.textContent = '캐릭터는 6명까지 만들 수 있습니다. 기존 캐릭터를 삭제해 주세요.'; return; }
  roster.unshift({ name, cls: cur.id, at: Date.now() });
  save(roster); render();
  hint.classList.remove('err'); hint.textContent = `${cur.name} ${name}을(를) 만들었습니다.`;
  $('nick').value = '';
  anim = 'attack'; t0 = performance.now(); mark();
});

let first = CLASSES[0];
try { first = CLASSES.find(c => c.id === localStorage.getItem('eclipse.cc.class')) || first; } catch (e) {}
select(first); render();
requestAnimationFrame(draw);
</script>
