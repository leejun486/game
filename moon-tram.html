<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>달로 가는 전차</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#e8e4f4;
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
  #cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(100vw,177.78vh);height:min(56.25vw,100vh);display:block;background:#000;cursor:pointer}
  #ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(5,6,20,.35),rgba(0,0,0,.82));transition:opacity .6s}
  #ov.hide{opacity:0;pointer-events:none}
  .box{text-align:center;padding:24px}
  .jp{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif;
    font-size:clamp(28px,5vw,56px);letter-spacing:.35em;text-shadow:0 0 18px rgba(150,180,255,.7)}
  .kr{margin-top:10px;font-size:clamp(13px,1.8vw,18px);letter-spacing:.2em;opacity:.8}
  button{margin-top:28px;font:inherit;font-size:17px;letter-spacing:.12em;color:#f4f0ff;
    background:rgba(120,150,255,.14);border:1px solid rgba(190,205,255,.55);border-radius:999px;
    padding:12px 30px;cursor:pointer}
  button:hover{background:rgba(140,170,255,.28)}
  .hint{margin-top:18px;font-size:12px;opacity:.55;letter-spacing:.06em}
  #bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06)}
  #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fa6ff,#e6ecff)}
  #pz{position:absolute;right:16px;top:12px;font-size:13px;opacity:0;transition:opacity .3s;letter-spacing:.1em}
  #pz.on{opacity:.75}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ov"><div class="box">
  <div class="jp">月行き最終電車</div>
  <div class="kr">달로 가는 마지막 전차 · 80초</div>
  <button id="go">▶ 재생 (소리 켜짐)</button>
  <div class="hint">Space 일시정지 · R 처음부터 · ← → 5초 이동 · F 전체화면</div>
</div></div>
<div id="pz">일시정지</div>
<div id="bar"><i></i></div>
<script>
'use strict';
/* =====================================================================
   月行き最終電車 — 1990년대 OVA 셀 애니메이션 풍 80초 단편
   그림·움직임·소리를 모두 코드로 만든다 (Canvas 2D + Web Audio).
   ===================================================================== */
const W = 1280, H = 720, INK = '#0b0918', TAU = Math.PI * 2, END = 80;
const cv = document.getElementById('cv'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const scratch = mk(W, H), sctx = scratch.getContext('2d');
let BASE = null; // 이번 프레임의 기본 변환 (필름 흔들림 포함)

/* ---------- 수학 / 색 ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eo = t => 1 - Math.pow(1 - clamp(t), 3);
const eio = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const fr = x => x - Math.floor(x);
const hash = n => fr(Math.sin(n * 127.1 + 311.7) * 43758.5453123);
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const _hc = new Map();
function hex(c) { let v = _hc.get(c); if (v) return v; const n = parseInt(c.slice(1), 16); v = [n >> 16 & 255, n >> 8 & 255, n & 255]; _hc.set(c, v); return v; }
function mix(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${A[0] + (B[0] - A[0]) * t | 0},${A[1] + (B[1] - A[1]) * t | 0},${A[2] + (B[2] - A[2]) * t | 0})`; }
function rgba(c, a) { const A = hex(c); return `rgba(${A[0]},${A[1]},${A[2]},${clamp(a)})`; }
const DARKC = hex('#12142e');
function mc(a, b, t, d) {
  const A = hex(a), B = hex(b);
  let r = A[0] + (B[0] - A[0]) * t, g = A[1] + (B[1] - A[1]) * t, bl = A[2] + (B[2] - A[2]) * t;
  if (d) { r += (DARKC[0] - r) * d; g += (DARKC[1] - g) * d; bl += (DARKC[2] - bl) * d; }
  return `rgb(${r | 0},${g | 0},${bl | 0})`;
}

/* ---------- 그리기 도우미 ---------- */
function rrp(c, x, y, w, h, r) {
  if (typeof r === 'number') r = [r, r, r, r];
  const [a, b, d, e] = r;
  c.beginPath(); c.moveTo(x + a, y); c.lineTo(x + w - b, y); c.quadraticCurveTo(x + w, y, x + w, y + b);
  c.lineTo(x + w, y + h - d); c.quadraticCurveTo(x + w, y + h, x + w - d, y + h); c.lineTo(x + e, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - e); c.lineTo(x, y + a); c.quadraticCurveTo(x, y, x + a, y); c.closePath();
}
function glow(c, x, y, r, col, a) {
  if (r <= 1 || a <= 0.002) return;
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(0.3, rgba(col, a * 0.4)); g.addColorStop(1, rgba(col, 0));
  const o = c.globalCompositeOperation; c.globalCompositeOperation = 'lighter';
  c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2); c.globalCompositeOperation = o;
}
function star4(c, x, y, r, col, a, rot = 0) {
  if (a <= 0.01) return;
  c.save(); c.globalCompositeOperation = 'lighter'; c.translate(x, y); c.rotate(rot); c.globalAlpha = clamp(a); c.fillStyle = col;
  c.beginPath(); for (let i = 0; i < 8; i++) { const an = i * Math.PI / 4, rr = i % 2 ? r * 0.13 : r; c.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
  c.closePath(); c.fill(); c.restore(); glow(c, x, y, r * 0.9, col, a * 0.5);
}
function tile(c, img, x, y, a = 1, sc = 1) {
  const w = img.width * sc; let xx = ((x % w) + w) % w - w; c.globalAlpha = a;
  while (xx < W + 20) { c.drawImage(img, xx, y, w, img.height * sc); xx += w; } c.globalAlpha = 1;
}
function fullFill(c, style) { c.fillStyle = style; c.fillRect(-40, -40, W + 80, H + 80); }
function glowLine(c, pts, k = 1, a = 1) {
  c.save(); c.globalCompositeOperation = 'lighter'; c.lineCap = 'round'; c.lineJoin = 'round';
  const P = () => { c.beginPath(); pts.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); };
  c.strokeStyle = `rgba(70,170,255,${0.10 * a})`; c.lineWidth = 36 * k; P(); c.stroke();
  c.strokeStyle = `rgba(110,210,255,${0.30 * a})`; c.lineWidth = 13 * k; P(); c.stroke();
  c.strokeStyle = `rgba(228,250,255,${0.95 * a})`; c.lineWidth = 3.5 * k; P(); c.stroke();
  c.restore();
}

/* ---------- 비 / 물결 ---------- */
function rain(c, t, o) {
  const vx = o.vx, vy = o.vy, sp = Math.hypot(vx, vy), ux = vx / sp, uy = vy / sp, L = o.len;
  const X0 = -120, Y0 = -80, Wd = W + 240, Hd = H + 160;
  c.save(); c.strokeStyle = rgba(o.col, o.a); c.lineWidth = o.lw; c.lineCap = 'round'; c.beginPath();
  for (let i = 0; i < o.n; i++) {
    const s = o.seed * 1000 + i, k = 0.75 + hash(s + .5) * 0.5;
    let x = hash(s) * Wd + vx * k * t, y = hash(s + .25) * Hd + vy * k * t;
    x = X0 + ((x % Wd) + Wd) % Wd; y = Y0 + ((y % Hd) + Hd) % Hd;
    c.moveTo(x, y); c.lineTo(x - ux * L * k, y - uy * L * k);
  }
  c.stroke(); c.restore();
}
function ripples(c, t, y0, y1, a, n = 34, seed = 7) {
  if (y0 >= H) return;
  c.save(); c.strokeStyle = '#b8c6ff'; c.lineWidth = 1;
  for (let i = 0; i < n; i++) {
    const per = 0.7 + hash(seed + i) * 0.6, ph = t / per + hash(i * 3.1), cyc = Math.floor(ph), age = fr(ph);
    const x = hash(i * 7.7 + cyc * 1.3) * W, y = lerp(y0, y1, hash(i * 5.3 + cyc * 2.1));
    const persp = clamp((y - y0) / Math.max(1, y1 - y0)) * 0.8 + 0.2, r = (4 + age * 26) * persp;
    c.globalAlpha = a * (1 - age); c.beginPath(); c.ellipse(x, y, r, r * 0.28, 0, 0, TAU); c.stroke();
    if (age < 0.16) {
      c.beginPath(); c.moveTo(x - 3 * persp, y); c.lineTo(x - 5 * persp, y - 8 * persp);
      c.moveTo(x + 3 * persp, y); c.lineTo(x + 5 * persp, y - 8 * persp); c.moveTo(x, y); c.lineTo(x, y - 10 * persp); c.stroke();
    }
  }
  c.restore();
}
// 젖은 바닥 반사: 축 위의 그림을 뒤집어 물결치게 아래로 복사
function reflect(c, axis, t, alpha, fill) {
  if (axis >= H) return;
  sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.clearRect(0, 0, W, H); sctx.drawImage(c.canvas, 0, 0);
  c.save(); c.setTransform(BASE); fill(c, axis);
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = alpha;
  const ax = axis + BASE.f;
  for (let y = Math.max(0, Math.floor(ax)); y < H; y += 2) {
    const d = y - ax, sy = ax - d - 2; if (sy < 0) break;
    const off = Math.sin(y * 0.13 + t * 4) * (0.6 + d * 0.015) + Math.sin(y * 0.047 - t * 2) * d * 0.012;
    c.drawImage(scratch, 0, sy, W, 2, off, y, W, 2);
  }
  c.restore();
}
function groundFill(top, bot) {
  return (c, ax) => { const g = c.createLinearGradient(0, ax, 0, H); g.addColorStop(0, top); g.addColorStop(1, bot); c.fillStyle = g; c.fillRect(-40, ax, W + 80, H - ax + 40); };
}

/* ---------- 미리 그려 두는 배경들 ---------- */
function makeClouds(w, h, seed, layers, o) {
  const cv = mk(w, h), c = cv.getContext('2d'), R = rng(seed), bl = [];
  for (let i = 0; i < o.n; i++) {
    const r = o.rmin + R() * (o.rmax - o.rmin), x = R() * w; let y;
    if (o.deck === 'top') y = o.base + R() * o.spread - r * 0.4;
    else if (o.deck === 'bottom') y = o.base - R() * o.spread + r * 0.4;
    else y = o.base + (R() - 0.5) * o.spread * (1 - Math.abs(x / w - 0.5) * 1.2);
    bl.push([x, y, r]);
  }
  const all = [];
  for (const b of bl) { all.push(b); if (o.wrap !== false) { all.push([b[0] + w, b[1], b[2]]); all.push([b[0] - w, b[1], b[2]]); } }
  const shape = (dx, dy, k) => {
    c.beginPath();
    for (const [x, y, r] of all) { c.moveTo(x + dx + r * k, y + dy); c.arc(x + dx, y + dy, r * k, 0, TAU); }
    if (o.deck === 'top') c.rect(-20 + dx, -20 + dy, w + 40, o.base + 20);
    if (o.deck === 'bottom') c.rect(-20 + dx, o.base + dy, w + 40, h - o.base + 40);
  };
  shape(0, 0, 1); c.fillStyle = layers[0].col; c.fill();
  c.globalCompositeOperation = 'source-atop';
  for (let i = 1; i < layers.length; i++) { const L = layers[i]; shape(L.dx, L.dy, L.k || 1); c.fillStyle = L.col; c.fill(); }
  return cv;
}
function makeCity(w, h, seed) {
  const cv = mk(w, h), c = cv.getContext('2d'), R = rng(seed), blinks = [];
  const cols = ['#0f1330', '#131838', '#10142c', '#161b3e'];
  let x = 0;
  while (x < w) {
    const bw = 30 + R() * 90, bh = R() < 0.12 ? 190 + R() * 140 : 50 + R() * 130, top = h - bh;
    c.fillStyle = cols[(R() * 4) | 0]; c.fillRect(x, top, bw, bh);
    c.fillStyle = 'rgba(0,0,12,0.3)'; c.fillRect(x + bw * 0.78, top, bw * 0.22, bh);
    c.fillStyle = 'rgba(90,80,150,0.25)'; c.fillRect(x, top, bw * 0.78, 2);
    if (R() < 0.35) { c.fillStyle = '#0d1028'; c.fillRect(x + bw * 0.2, top - 10, bw * 0.3, 10); }
    if (R() < 0.32) {
      const ax = x + bw * (0.3 + R() * 0.4), ah = 20 + R() * 50;
      c.strokeStyle = '#0d1028'; c.lineWidth = 2; c.beginPath(); c.moveTo(ax, top); c.lineTo(ax, top - ah); c.stroke();
      blinks.push([ax, top - ah, R()]);
    }
    for (let wy = top + 8; wy < h - 6; wy += 9) for (let wx = x + 5; wx < x + bw * 0.76 - 4; wx += 8) {
      if (R() < 0.13) { c.fillStyle = ['#ffcf7a', '#ffe3a8', '#9fe3ff', '#ffa070'][(R() * 4) | 0]; c.globalAlpha = 0.45 + R() * 0.55; c.fillRect(wx, wy, 4, 5); c.globalAlpha = 1; }
    }
    x += bw + (R() < 0.3 ? R() * 10 : 0);
  }
  const signs = ['ホテル', '喫茶', '酒', '薬', '本', 'ゲーム', '珈琲', '湯', '寿司'];
  for (let i = 0; i < signs.length; i++) {
    const nx = 60 + R() * (w - 120), ny = h - 80 - R() * 130, col = ['#ff4fa8', '#4ff0ff', '#ff9b3d', '#b06bff'][i % 4];
    const txt = signs[i], len = [...txt].length;
    c.save(); c.fillStyle = '#07081a'; c.fillRect(nx - 7, ny - 4, 15, len * 13 + 6);
    c.shadowColor = col; c.shadowBlur = 12; c.fillStyle = col; c.font = 'bold 11px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'top';
    [...txt].forEach((ch, k) => c.fillText(ch, nx, ny + k * 13)); c.restore();
  }
  c.globalCompositeOperation = 'lighter';
  const g = c.createLinearGradient(0, h - 130, 0, h); g.addColorStop(0, 'rgba(120,60,130,0)'); g.addColorStop(1, 'rgba(160,70,140,0.38)');
  c.fillStyle = g; c.fillRect(0, h - 130, w, 130);
  return { cv, blinks };
}
function makeMoon(R) {
  const S = R * 2 + 4, cv = mk(S, S), c = cv.getContext('2d'), cx = S / 2, cy = S / 2, rg = rng(77);
  c.beginPath(); c.arc(cx, cy, R, 0, TAU); c.fillStyle = '#f4eedb'; c.fill();
  c.save(); c.clip();
  c.fillStyle = '#ddd4b8';
  for (let i = 0; i < 7; i++) {
    const mx = cx + (rg() - 0.5) * R * 1.2, my = cy + (rg() - 0.5) * R * 1.2;
    for (let j = 0; j < 6; j++) { c.beginPath(); c.arc(mx + (rg() - 0.5) * R * 0.35, my + (rg() - 0.5) * R * 0.35, R * (0.08 + rg() * 0.14), 0, TAU); c.fill(); }
  }
  for (let i = 0; i < 28; i++) {
    const x = cx + (rg() - 0.5) * R * 1.9, y = cy + (rg() - 0.5) * R * 1.9, r = R * (0.02 + rg() * 0.07);
    c.fillStyle = '#cbc3a8'; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
    c.fillStyle = '#f8f3e2'; c.beginPath(); c.arc(x + r * 0.22, y + r * 0.22, r * 0.74, 0, TAU); c.fill();
  }
  c.fillStyle = 'rgba(118,126,182,0.42)'; c.beginPath(); c.rect(0, 0, S, S); c.arc(cx + R * 0.22, cy - R * 0.18, R * 1.04, 0, TAU, true); c.fill('evenodd');
  c.restore();
  c.strokeStyle = 'rgba(255,255,255,0.85)'; c.lineWidth = R * 0.022; c.beginPath(); c.arc(cx, cy, R * 0.985, -1.7, 0.25); c.stroke();
  return cv;
}
function makeStars() {
  const cv = mk(W, H), c = cv.getContext('2d'), R = rng(31);
  for (let i = 0; i < 750; i++) {
    const x = R() * W, y = R() * H, a = 0.15 + R() * 0.6, s = R() < 0.9 ? 1 : 1.7;
    c.fillStyle = `rgba(${200 + R() * 55 | 0},${210 + R() * 45 | 0},255,${a})`; c.fillRect(x, y, s, s);
  }
  return cv;
}
const BIGSTARS = (() => { const R = rng(32), a = []; for (let i = 0; i < 34; i++) a.push([R() * W, R() * H * 0.75, 4 + R() * 7, R()]); return a; })();
const BOKEH = (() => { const R = rng(21), a = []; for (let i = 0; i < 34; i++) a.push([R() * W, 210 + R() * 400, 18 + R() * 60, ['#ff9a4a', '#ff5fa8', '#5fe0ff', '#ffd27a', '#9a7aff'][i % 5], 0.07 + R() * 0.13, R()]); return a; })();
const RUST = (() => { const R = rng(5), a = []; for (let i = 0; i < 36; i++) a.push([-190 + R() * 380, -150 + R() * 118, 5 + R() * 18, 3 + R() * 9, R() * 3]); return a; })();
const RUSTF = (() => { const R = rng(6), a = []; for (let i = 0; i < 18; i++) a.push([-90 + R() * 180, -150 + R() * 118, 5 + R() * 12, 3 + R() * 7, R() * 3]); return a; })();
// 내려다본 도시 불빛 (지면 좌표 X,Z)
const LIGHTS = (() => {
  const R = rng(99), groups = { '#ffb050': [], '#ffd89a': [], '#dfe9ff': [], '#ff5fae': [], '#6ff3ff': [] }, keys = Object.keys(groups);
  const add = (X, Z) => { const r = R(), k = r < 0.55 ? 0 : r < 0.78 ? 1 : r < 0.93 ? 2 : r < 0.97 ? 3 : 4; groups[keys[k]].push(X, Z, 0.6 + R() * 0.8); };
  const river = Z => Math.abs(Z - 2600) < 170;
  for (let X = -3000; X < 3000; X += 150) { if (R() < 0.15) continue; for (let Z = 250; Z < 9000; Z += 40 + R() * 40) { if (!river(Z)) add(X + (R() - 0.5) * 8, Z); } }
  for (let Z = 300; Z < 9000; Z += 110 + R() * 80) { if (river(Z)) continue; for (let X = -3000; X < 3000; X += 40 + R() * 40) add(X, Z + (R() - 0.5) * 6); }
  for (let i = 0; i < 2600; i++) { const X = -3000 + R() * 6000, Z = 300 + R() * 8700; if (!river(Z)) add(X, Z); }
  return groups;
})();

let CITY, CL, MOON, STARS, GRAINS, VIG;
function prerender() {
  CITY = makeCity(2800, 360, 3);
  CL = {
    stormFar: makeClouds(2400, 360, 11, [{ col: '#3b2c5e' }, { col: '#1c1d4a', dx: 0, dy: -7 }, { col: '#12153b', dx: 0, dy: -30 }], { n: 70, deck: 'top', base: 170, spread: 120, rmin: 40, rmax: 100 }),
    stormNear: makeClouds(2400, 340, 12, [{ col: '#4a3466' }, { col: '#221f4e', dx: 0, dy: -8 }, { col: '#14163e', dx: 0, dy: -34 }], { n: 60, deck: 'top', base: 150, spread: 140, rmin: 50, rmax: 120 }),
    sea1: makeClouds(2600, 360, 13, [{ col: '#1c2760' }, { col: '#3b4c96', dx: -4, dy: -10 }, { col: '#7385c8', dx: -8, dy: -24 }, { col: '#cbd7f7', dx: -11, dy: -38, k: 0.9 }], { n: 80, deck: 'bottom', base: 200, spread: 110, rmin: 45, rmax: 110 }),
    sea2: makeClouds(2600, 300, 14, [{ col: '#1a2358' }, { col: '#33438a', dx: -3, dy: -8 }, { col: '#6475b8', dx: -6, dy: -18 }, { col: '#b6c4ee', dx: -8, dy: -28, k: 0.88 }], { n: 90, deck: 'bottom', base: 170, spread: 80, rmin: 30, rmax: 75 }),
    sea3: makeClouds(2600, 240, 15, [{ col: '#1b2256' }, { col: '#2f3d80', dx: -2, dy: -5 }, { col: '#5868a8', dx: -4, dy: -12 }, { col: '#a3b2e2', dx: -5, dy: -18, k: 0.85 }], { n: 110, deck: 'bottom', base: 140, spread: 50, rmin: 18, rmax: 45 }),
    puff: makeClouds(1400, 520, 16, [{ col: '#8a98c8' }, { col: '#b9c5ea', dx: -6, dy: -14 }, { col: '#e3e9ff', dx: -12, dy: -30, k: 0.92 }], { n: 46, base: 260, spread: 300, rmin: 60, rmax: 150, wrap: false }),
  };
  MOON = makeMoon(300);
  STARS = makeStars();
  GRAINS = [0, 1, 2, 3].map(() => {
    const g = mk(640, 360), gc = g.getContext('2d'), id = gc.createImageData(640, 360), d = id.data;
    for (let p = 0; p < d.length; p += 4) { const v = Math.random() * 255; d[p] = d[p + 1] = d[p + 2] = v; d[p + 3] = 255; }
    gc.putImageData(id, 0, 0); return g;

    gpts.push([24.2, 0.009], [34, 0.005], [34.5, 0]); applyEnv(g.gain, gpts);

    const h1 = osc('sine', 50), h2 = osc('sine', 100), hg = G(0); applyEnv(hg.gain, [[22.5, 0], [24, 0.05], [29, 0.08], [34, 0.06], [38, 0.04], [46, 0]]);
    h1.connect(hg); h2.connect(hg); hg.connect(A.sfx); h1.start(at(22.6)); h2.start(at(22.6)); h1.stop(A.t0 + 46.2); h2.stop(A.t0 + 46.2);
  });
  ev(25, 0.3, () => { tone(25, 1760, { dur: 0.09, vol: 0.03, dest: A.sfx }); tone(25.12, 2350, { dur: 0.14, vol: 0.025, dest: A.sfx }); nz(25, { dur: 0.012, vol: 0.1, f: 3000, q: 2 }); });
  ev(26.5, 1.3, () => tone(26.5, 85, { type: 'sawtooth', dur: 1.1, vol: 0.05, f2: 170, glide: 1.1, lp: 700, a: 0.15, dest: A.sfx }));
  ev(27.6, 0.4, () => { tone(27.6, 140, { dur: 0.22, vol: 0.3, f2: 50, dest: A.sfx }); nz(27.6, { dur: 0.08, vol: 0.2, type: 'lowpass', f: 900 }); tone(27.62, 2400, { type: 'sawtooth', dur: 0.15, vol: 0.05, f2: 300, dest: A.sfx }); });
  for (let i = 0; i < 32; i++) { const T = 27.6 + Math.pow(R(), 1.6) * 1.0, d = 0.01 + R() * 0.03, v = 0.08 + R() * 0.15, f = 3000 + R() * 4000; ev(T, 0.1, () => nz(T, { dur: d, vol: v, type: 'highpass', f, q: 1 })); }
  for (let T = 28.6; T < 34; T += 0.125) if (hash(Math.floor(T * 8) * 1.3) > 0.86) { const TT = T; ev(TT, 0.1, () => nz(TT, { dur: 0.03, vol: 0.08, type: 'highpass', f: 4000 })); }
  ev(28.35, 1, () => { tone(28.35, 150, { type: 'sawtooth', dur: 0.85, vol: 0.05, f2: 1800, glide: 0.85, lp: 2500, swell: true, dest: A.sfx }); nz(28.35, { dur: 0.85, vol: 0.16, type: 'bandpass', f: 400, f2: 5000, q: 2, swell: true }); });
  ev(29.2, 2.6, () => {
    tone(29.2, 95, { dur: 1.6, vol: 0.55, f2: 32, glide: 1.2, dest: A.sfx }); nz(29.2, { dur: 1.2, vol: 0.3, type: 'lowpass', f: 1200, f2: 200 });
    for (const f of [2093, 2637, 3136, 3951, 4699]) tone(29.2, f, { dur: 2.5, vol: 0.02, rev: 0.8 });
  });
  for (let i = 0; i < 16; i++) { const T = 30 + i * 0.21 + R() * 0.08, m = [84, 86, 88, 91, 93, 96][Math.min(5, (i / 3) | 0)]; ev(T, 0.7, () => tone(T, mf(m), { dur: 0.6, vol: 0.018, rev: 0.7 })); }
  ev(32.3, 2, () => bell(32.3, 1180, 0.09)); ev(32.72, 2, () => bell(32.72, 1180, 0.08));
  ev(31.6, 2.5, () => nz(31.6, { dur: 2.4, vol: 0.12, type: 'bandpass', f: 300, f2: 3500, q: 1.5, swell: true }));

  /* --- 34–46s: 빛의 선로, 출발, 이륙 --- */
  for (let k = 0; k < 20; k++) { const T = 34.3 + k * 0.13, m = [72, 74, 76, 79, 81][k % 5] + 12 * ((k / 5) | 0) * 0.5; ev(T, 0.6, () => tone(T, mf(Math.round(m)), { dur: 0.5, vol: 0.014, rev: 0.7 })); }
  ev(35.4, 1.5, () => { for (let i = 0; i < 8; i++) tone(35.4 + i * 0.09, 2600 + i * 230, { dur: 0.4, vol: 0.012, rev: 0.8 }); });
  ev(37, 10, () => {
    const o = osc('sawtooth', 180), bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 3;
    const steps = [[37, 38.9, 180, 520], [38.9, 40.5, 330, 820], [40.5, 42, 520, 1150], [42, 46, 900, 1350]];
    for (const [a, b, f0, f1] of steps) { const ta = A.t0 + a; if (ta < ac.currentTime) continue; o.frequency.setValueAtTime(f0, ta); o.frequency.linearRampToValueAtTime(f1, A.t0 + b - 0.01); bp.frequency.setValueAtTime(f0 * 2, ta); bp.frequency.linearRampToValueAtTime(f1 * 2, A.t0 + b - 0.01); }

    const d = j - 400 - off; if (d <= 0) continue; const T = tOf(d), v = 0.12 + 0.04 * hash(j + off);
    ev(T, 0.15, () => { nz(T, { dur: 0.05, vol: v, type: 'bandpass', f: 1500, q: 1.5 }); tone(T, 80, { dur: 0.08, vol: 0.12, dest: A.sfx }); });

  ev(40.6, 2.6, () => { nz(40.6, { dur: 2.4, vol: 0.2, type: 'bandpass', f: 250, f2: 2200, q: 1.2, a: 1 }); for (const f of [1568, 2093, 2637]) tone(41, f, { dur: 2, vol: 0.02, rev: 0.8 }); });

  /* --- 46–60s: 상승, 구름 돌파, 구름 위 --- */
  ev(46, 9, () => { const src = track(ac.createBufferSource()); src.buffer = PINK; src.loop = true; const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 600; bp.Q.value = 0.6; const g = G(0); applyEnv(g.gain, [[46, 0], [47, 0.12], [53, 0.14], [54.3, 0]]); src.connect(bp); bp.connect(g); g.connect(A.sfx); src.start(at(46)); src.stop(A.t0 + 54.5); });
  ev(52.4, 2.2, () => nz(52.4, { dur: 2.0, vol: 0.35, type: 'bandpass', f: 200, f2: 1800, q: 0.9, a: 1.75 }));
  ev(54.4, 6, () => { const src = track(ac.createBufferSource()); src.buffer = PINK; src.loop = true; const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2500; const g = G(0); applyEnv(g.gain, [[54.4, 0], [56, 0.05], [60, 0.02], [67, 0]]); src.connect(hp); hp.connect(g); g.connect(A.sfx); src.start(at(54.4)); src.stop(A.t0 + 67.2); });
  for (const T of [62.5, 65.8, 77.2]) ev(T, 1, () => tone(T, 2600, { dur: 0.8, vol: 0.022, f2: 1600, glide: 0.8, rev: 0.8 }));
  ev(72.6, 1.5, () => nz(72.6, { dur: 1.4, vol: 0.14, type: 'bandpass', f: 500, f2: 6000, q: 1.2, swell: true }));
  ev(74, 3, () => { bell(74, 1568, 0.07, A.music, 0.8); bell(74.02, 2093, 0.05, A.music, 0.8); tone(74, 65, { dur: 2, vol: 0.3, f2: 40, dest: A.sfx }); });
  ev(76.6, 2.5, () => bell(76.6, 1180, 0.035, A.sfx, 1)); ev(77.05, 2.5, () => bell(77.05, 1180, 0.03, A.sfx, 1));

  /* --- 음악 34–80s (96 BPM, IV–V–iii–vi 진행) --- */
  const BT = 0.625, BAR = 2.5, M0 = 34;
  const CH = { F: [53, 57, 60, 64], G: [55, 59, 62, 64], Em: [52, 55, 59, 62], Am: [57, 60, 64, 67, 71], G7: [55, 59, 62, 65] };
  const RT = { F: 41, G: 43, Em: 40, Am: 45, G7: 43 };
  const PROG = ['F', 'G', 'Em', 'Am', 'F', 'G', 'Em', 'Am', 'F', 'G', 'Em', 'Am', 'F', 'G', 'Em', 'G7'];
  PROG.forEach((nm, b) => {
    const Tb = M0 + b * BAR, ch = CH[nm], rt = RT[nm];
    ev(Tb, 3.3, () => pad(Tb, BAR, ch, { vol: b < 8 ? 0.016 : 0.02, cut: b < 4 ? 900 : b < 8 ? 1500 : 2300, att: 0.3, rel: 0.7, det: 9 }));
    if (b >= 8 && b < 14) ev(Tb, 3.5, () => pad(Tb, BAR, ch.map(m => m + 12), { vol: 0.007, cut: 3800, att: 0.8, rel: 0.9, det: 14, rev: 0.6 }));
    const ar = ch.slice(0, 4).map(m => m + 12), seq = [0, 1, 2, 3, 2, 1, 2, 3];

    if (b < 4) ev(Tb, 2.6, () => bass(Tb, mf(rt), BAR * 0.95, 0.13));

    else for (const k of [0, 2]) { const T = Tb + k * BT; ev(T, 1.4, () => bass(T, mf(rt), BT * 2 * 0.95, 0.12)); }
    if (b >= 4 && b < 14) {

      for (const k of [1, 3]) { const T = Tb + k * BT; ev(T, 0.3, () => snare(T)); }
      for (let k = 0; k < 8; k++) { const T = Tb + k * BT / 2; ev(T, 0.3, () => hat(T, k % 2 ? 0.03 : 0.045, k === 7)); }
      if (b === 7) for (const k of [3.25, 3.5, 3.75]) { const T = Tb + k * BT; ev(T, 0.3, () => snare(T, 0.16)); }
    }
    if (b === 15) { ev(Tb, 0.4, () => kick(Tb, 0.4)); for (let k = 0; k < 16; k++) { const T = Tb + k * BT / 4; ev(T, 0.3, () => snare(T, 0.03 + 0.011 * k)); } }
  });
  for (const T of [44, 54, 74]) ev(T, 2.5, () => crash(T));
  const PA = [[0, 'E5', 1], [1, 'G5', .5], [1.5, 'A5', .5], [2, 'C6', 1.5], [3.5, 'A5', .5], [4, 'B5', 1], [5, 'A5', .5], [5.5, 'G5', .5], [6, 'D5', 1], [7, 'E5', 1], [8, 'G5', 1.5], [9.5, 'E5', .5], [10, 'D5', 1], [11, 'B4', 1], [12, 'C5', 1], [13, 'E5', 1], [14, 'A5', 2]];
  const PB = [[0, 'A5', 1], [1, 'C6', .5], [1.5, 'D6', .5], [2, 'E6', 1.5], [3.5, 'D6', .5], [4, 'D6', 1], [5, 'C6', .5], [5.5, 'B5', .5], [6, 'G5', 2], [8, 'B5', 1], [9, 'C6', .5], [9.5, 'B5', .5], [10, 'G5', 1], [11, 'E5', 1], [12, 'A5', 3], [15, 'E5', .5], [15.5, 'G5', .5]];
  const PB2 = PB.slice(0, 14).concat([[12, 'A5', 1.5], [13.5, 'B5', .5], [14, 'C6', 1], [15, 'D6', 1]]);
  const phr = (arr, bar, fn) => { for (const [b, n, d] of arr) { const T = M0 + bar * BAR + b * BT; ev(T, d * BT + 1, () => fn(T, mf(N(n)), d * BT)); } };
  phr(PA, 0, (T, f, d) => ep(T, f, d, 0.05));
  phr(PB, 4, (T, f, d) => ep(T, f, d, 0.055));
  phr(PA, 8, (T, f, d) => { lead(T, f, d, 0.05); ep(T, f / 2, d, 0.03); });
  phr(PB2, 12, (T, f, d) => { lead(T, f, d, 0.05); ep(T, f / 2, d, 0.025); });
  ev(74, 7, () => { pad(74, 4.2, [48, 55, 59, 62, 64], { vol: 0.02, cut: 2200, att: 0.05, rel: 2.6, det: 9, rev: 0.6 }); bass(74, mf(36), 4.5, 0.13); lead(74, mf(88), 3.8, 0.05); });
  [72, 76, 79, 83, 86, 88].forEach((m, i) => { const T = 74 + i * 0.16; ev(T, 2, () => ep(T, mf(m), 1.5, 0.03, { rev: 0.6 })); });
}

/* =====================================================================
   재생 제어
   ===================================================================== */
const ov = document.getElementById('ov'), goBtn = document.getElementById('go'), barI = document.querySelector('#bar i'), pz = document.getElementById('pz');
let playing = false, paused = false, fbStart = 0, fbPausedAt = null, ended = false;
function curT() {
  if (AU && AC) return AC.currentTime - AU.t0;
  if (fbPausedAt !== null) return fbPausedAt;
  return (performance.now() - fbStart) / 1000;
}
function play(offset = 0) {
  offset = clamp(offset, 0, END - 0.5);
  ov.classList.add('hide'); ended = false; paused = false; pz.classList.remove('on');
  try { audioStart(offset); if (AC.state === 'suspended') AC.resume(); }
  catch (e) { console.warn('audio unavailable', e); AU = null; fbStart = performance.now() - offset * 1000; fbPausedAt = null; }
  playing = true;
}
function togglePause() {
  if (!playing) return;
  paused = !paused; pz.classList.toggle('on', paused);
  if (AU && AC) { paused ? AC.suspend() : AC.resume(); }
  else if (paused) fbPausedAt = curT(); else { fbStart = performance.now() - fbPausedAt * 1000; fbPausedAt = null; }
}
function finish() {
  playing = false; ended = true; audioStop();
  goBtn.textContent = '↺ 다시 보기'; ov.classList.remove('hide');
}
function loop() {
  requestAnimationFrame(loop);
  if (!playing) return;
  audioPump();
  const T = Math.max(0, curT());
  if (T >= END) { frame(END - 0.001); barI.style.width = '100%'; finish(); return; }
  frame(T); barI.style.width = (T / END * 100).toFixed(2) + '%';
}
setInterval(audioPump, 150);
goBtn.addEventListener('click', () => play(0));
cv.addEventListener('click', () => { if (playing) togglePause(); });
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (playing) togglePause(); else play(0); }
  else if (e.code === 'KeyR') play(0);
  else if (e.code === 'ArrowRight' && playing) play(curT() + 5);
  else if (e.code === 'ArrowLeft' && playing) play(curT() - 5);
  else if (e.code === 'KeyF') { const el = document.documentElement; document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen && el.requestFullscreen(); }
});

prerender();
const qs = new URLSearchParams(location.search);
if (qs.has('still')) { ov.classList.add('hide'); frame(parseFloat(qs.get('still'))); }
else { frame(5.5); }
window.__frame = frame;
requestAnimationFrame(loop);
