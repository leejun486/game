<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>월하궁: 도깨비 야행</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="flash"></div>
  <div id="hpbars"></div>
  <div id="numbers"></div>

  <div id="hud" class="hidden">
    <div id="status" class="panel">
      <div id="portrait"><canvas id="portrait-cv" width="20" height="20"></canvas></div>
      <div class="col">
        <div class="name">검객 <b>이랑</b><span class="lv">Lv.7</span></div>
        <div class="bar hp"><i id="hp-lag"></i><i id="hp-fill"></i><span id="hp-text"></span></div>
        <div class="skills">
          <div class="sk"><span class="key">J</span><em>베기</em></div>
          <div class="sk"><span class="key">␣</span><em>회피</em><i class="cd" id="cd-dash"></i></div>
          <div class="sk"><span class="key">K</span><em>검기</em><i class="cd" id="cd-skill"></i></div>
        </div>
      </div>
    </div>

    <div id="quest" class="panel">
      <div id="quest-title">임무</div>
      <div id="quest-text"></div>
      <div class="kills">퇴치 <b id="kills">0</b> · 최고 연속 <b id="best">0</b></div>
    </div>

    <div id="logo"><span class="han">月下宮</span><span class="sub">도깨비 야행</span></div>

    <div id="boss"><div id="boss-name"></div><div class="bar"><i id="boss-lag"></i><i id="boss-fill"></i></div></div>

    <div id="combo"><b id="combo-n">0</b><span>연속 베기</span></div>

    <div id="help">
      <span><b>WASD</b> 이동</span><span><b>J</b>/<b>클릭</b> 베기</span><span><b>Space</b> 회피</span><span><b>K</b>/<b>우클릭</b> 검기</span>
      <span><b>E</b> 대화·북</span><span><b>N</b> 낮/밤</span><span><b>휠</b> 확대</span><span><b>O</b> 외곽선</span><span><b>M</b> 음악</span>
    </div>
  </div>

  <div id="banner"><div id="banner-main"></div><div id="banner-sub"></div></div>
  <div id="toast"></div>
  <div id="savemark">◆ 자동 저장됨</div>
  <div id="prompt"></div>
  <div id="dialog"><div id="dialog-name"></div><div id="dialog-text"></div><div class="next">▼</div></div>

  <div id="title">
    <div class="logo-big"><span class="han">月下宮</span><span class="kr">월하궁</span><span class="sub">— 도깨비 야행 —</span></div>
    <div id="title-save"></div>
    <div class="press">아무 키나 눌러 시작</div>
    <div class="credit">도트 3D 액션 · Three.js</div>
  </div>

  <div id="gameover">
    <div class="t">쓰러졌다…</div>
    <div class="s"><b>R</b> 키를 눌러 다시 일어서기</div>
  </div>

  <div id="touch">
    <div id="stick-area"></div>
    <div id="stick"><i></i></div>
    <div class="btns">
      <button data-k="act">E</button>
      <button data-k="skill">검기</button>
      <button data-k="dash">회피</button>
      <button data-k="atk" class="big">베기</button>
    </div>
  </div>
</div>
<script src="dist/game.js"></script>
</body>
</html>
