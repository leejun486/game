<meta charset="utf-8">
<title>이클립스 서바이버</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: full-bleed canvas battlefield; menus are hanji sheets floating over an eclipsed night. */
:root {
  --night: #0c0b10;
  --ink: #16131b;
  --ink-2: #221d27;
  --hanji: #efe6cf;
  --gold: #e9d7a8;
  --gold-2: #c9a45c;
  --gold-dark: #7a6232;
  --blood: #c3272b;
  --corona: #ffcf7a;
  --jade: #5fbf9a;
  --muted: #a39a88;
  --line: rgba(233, 215, 168, 0.22);
  --scrim: rgba(8, 6, 10, 0.78);
  --f-display: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --f-ui: "Gowun Dodum", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--night); color: var(--hanji); }
body { font-family: var(--f-ui); user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--corona); outline-offset: 3px; }
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; }

.screen {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--scrim); overflow-y: auto; z-index: 5;
}
.sheet {
  width: min(760px, 100%); margin: auto;
  background: linear-gradient(180deg, rgba(34, 29, 39, 0.96), rgba(18, 15, 22, 0.97));
  border: 1px solid var(--line); border-radius: 4px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 0 0 4px rgba(0, 0, 0, 0.25), inset 0 0 0 5px rgba(233, 215, 168, 0.08);
  padding: clamp(18px, 4vw, 32px);
  display: flex; flex-direction: column; gap: 18px;
}
.eyebrow { font-size: 12px; letter-spacing: 0.32em; color: var(--gold-2); text-transform: uppercase; }
h1, h2 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; color: var(--gold); }
h2 { font-size: clamp(22px, 4vw, 30px); }
.sub { color: var(--muted); margin: 0; line-height: 1.6; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  border: 1px solid var(--gold-dark); background: linear-gradient(180deg, #3a2f22, #241d15);
  padding: 12px 22px; border-radius: 3px; font-size: 16px; color: var(--gold);
  font-family: var(--f-display); font-weight: 700; letter-spacing: 0.06em;
}
.btn:hover { border-color: var(--gold-2); color: #fff3d0; }
.btn.primary { background: linear-gradient(180deg, #9a2a22, #5e1612); border-color: #d9654f; color: #ffe9cf; }
.btn.primary:hover { background: linear-gradient(180deg, #b23328, #6e1a15); }
.btn.ghost { background: transparent; }
.btn:disabled { opacity: 0.4; cursor: default; }

/* title */
#title .sheet { background: transparent; border: 0; box-shadow: none; align-items: center; text-align: center; gap: 22px; }
.eclipse { width: clamp(150px, 34vw, 230px); aspect-ratio: 1; max-width: 100%; position: relative; }
.eclipse::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(circle, transparent 54%, rgba(255, 207, 122, 0.95) 56%, rgba(255, 140, 60, 0.45) 62%, rgba(195, 39, 43, 0.15) 72%, transparent 76%);
  filter: blur(1px); animation: corona 6s ease-in-out infinite;
}
.eclipse::after { content: ""; position: absolute; inset: 21%; border-radius: 50%; background: #050407; box-shadow: 0 0 0 1px rgba(255, 220, 160, 0.4); }
@keyframes corona { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.04); opacity: 1; } }
#title h1 { font-size: clamp(38px, 9vw, 72px); letter-spacing: 0.04em; line-height: 1.05; }
#title h1 small { display: block; font-size: 0.32em; letter-spacing: 0.5em; color: var(--gold-2); margin-top: 10px; font-weight: 400; }
.purse { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
.purse b { color: var(--gold); font-variant-numeric: tabular-nums; }
.keys { color: var(--muted); font-size: 13px; line-height: 1.7; }
.keys kbd { font-family: var(--f-ui); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; color: var(--hanji); }

/* hero select */
.heroes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 620px) { .heroes { grid-template-columns: 1fr; } }
.hero {
  border: 1px solid var(--line); background: rgba(0, 0, 0, 0.25); border-radius: 3px; padding: 12px;
  display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 12px; text-align: left; align-items: start;
}
@media (min-width: 621px) { .hero { grid-template-columns: 1fr; text-align: center; justify-items: center; } }
.hero canvas { width: 96px; height: 96px; image-rendering: pixelated; grid-row: span 3; }
@media (min-width: 621px) { .hero canvas { grid-row: auto; } }
.hero.sel { border-color: var(--corona); background: rgba(255, 207, 122, 0.08); box-shadow: inset 0 0 0 1px rgba(255, 207, 122, 0.4); }
.hero h3 { margin: 0; font-family: var(--f-display); color: var(--gold); font-size: 19px; }
.hero p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
.hero .perk { color: var(--jade); font-size: 13px; }
.hero .wpn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--hanji); }
.hero .wpn img { width: 22px; height: 22px; }

/* upgrade cards */
.cards { display: grid; gap: 10px; }
.card {
  display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 4px 14px; align-items: center; text-align: left;
  border: 1px solid var(--line); background: rgba(239, 230, 207, 0.04); padding: 12px 14px; border-radius: 3px;
}
.card:hover, .card:focus-visible { border-color: var(--gold-2); background: rgba(239, 230, 207, 0.09); }
.card img { width: 56px; height: 56px; grid-row: span 2; border: 1px solid rgba(0, 0, 0, 0.6); border-radius: 3px; background: #0a090c; }
.card .nm { font-family: var(--f-display); font-weight: 700; font-size: 18px; color: var(--gold); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.card .lv { font-family: var(--f-ui); font-size: 12px; color: var(--muted); font-weight: 400; }
.card .new { font-family: var(--f-ui); font-size: 11px; color: #1a120a; background: var(--corona); padding: 1px 6px; border-radius: 2px; font-weight: 400; }
.card .evo { background: #e8423a; color: #fff; }
.card .ds { color: var(--hanji); opacity: 0.85; font-size: 14px; line-height: 1.45; }

/* shop */
.shop { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .shop { grid-template-columns: 1fr; } }
.shop .card { grid-template-columns: 44px minmax(0, 1fr) auto; }
.shop .card img { width: 44px; height: 44px; }
.pips { display: flex; gap: 3px; margin-top: 2px; }
.pips i { width: 10px; height: 4px; background: rgba(239, 230, 207, 0.15); }
.pips i.on { background: var(--corona); }
.cost { font-variant-numeric: tabular-nums; color: var(--gold); font-size: 14px; white-space: nowrap; grid-row: span 2; }

/* results */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { border-top: 1px solid var(--line); padding-top: 8px; }
.stat span { display: block; font-size: 12px; color: var(--muted); letter-spacing: 0.08em; }
.stat b { font-family: var(--f-display); font-size: 24px; color: var(--gold); font-variant-numeric: tabular-nums; }
.dmg { width: 100%; border-collapse: collapse; font-size: 14px; }
.dmg td { padding: 6px 4px; border-bottom: 1px solid rgba(233, 215, 168, 0.1); font-variant-numeric: tabular-nums; }
.dmg td:last-child { text-align: right; color: var(--gold); }
.dmg img { width: 22px; height: 22px; vertical-align: middle; margin-right: 8px; }
.wrap-x { overflow-x: auto; }

#pauseBtn {
  position: fixed; z-index: 4; top: calc(26px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px));
  width: 38px; height: 38px; border-radius: 3px; border: 1px solid var(--line); background: rgba(10, 8, 12, 0.6); color: var(--gold); font-size: 15px;
}
#dashBtn {
  position: fixed; z-index: 4; right: calc(22px + env(safe-area-inset-right, 0px)); bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  width: 74px; height: 74px; border-radius: 50%; border: 2px solid rgba(138, 212, 255, 0.6);
  background: radial-gradient(circle, rgba(60, 110, 160, 0.55), rgba(10, 8, 12, 0.6)); color: #dff2ff;
  font-family: var(--f-display); font-weight: 700; font-size: 17px; touch-action: none;
}
#dashBtn:active { transform: scale(0.94); }
@media (hover: hover) and (pointer: fine) { #dashBtn { display: none; } }
#banner {
  position: fixed; left: 0; right: 0; top: 30%; text-align: center; z-index: 3; pointer-events: none;
  font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 6vw, 46px); color: var(--corona);
  text-shadow: 0 0 18px rgba(195, 39, 43, 0.9), 0 2px 0 #000; letter-spacing: 0.08em; opacity: 0; transition: opacity 0.4s;
}
#banner small { display: block; font-size: 0.42em; color: var(--hanji); letter-spacing: 0.3em; margin-top: 6px; }
#banner.on { opacity: 1; }
#loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-family: var(--f-display); letter-spacing: 0.3em; z-index: 9; background: var(--night); }
@media (prefers-reduced-motion: reduce) { .eclipse::before { animation: none; } }
</style>

<canvas id="cv"></canvas>
<div id="banner"></div>
<button id="pauseBtn" hidden aria-label="일시 정지">❚❚</button>
<button id="dashBtn" hidden>회피</button>
<div id="loading">불러오는 중</div>

<section class="screen" id="title" hidden>
  <div class="sheet">
    <div class="eclipse" aria-hidden="true"></div>
    <h1>이클립스 서바이버<small>일식의 밤</small></h1>
    <p class="sub">해가 삼켜진 15분. 몰려드는 요괴를 베어 넘기고, 마지막에 나타나는 어둠의 군주를 쓰러뜨려라.</p>
    <div class="row" style="justify-content:center">
      <button class="btn primary" id="goSelect">출정</button>
      <button class="btn" id="goShop">영구 강화</button>
      <button class="btn ghost" id="sndBtn">소리 켜짐</button>
    </div>
    <div class="purse"><span>보유 엽전 <b id="tGold">0</b></span><span>최고 기록 <b id="tBest">—</b></span></div>
    <div class="keys"><kbd>WASD</kbd>·<kbd>방향키</kbd> 이동 · <kbd>Space</kbd> 회피 · 공격은 자동 · <kbd>Esc</kbd> 일시 정지 · 휴대폰은 화면을 끌어서 이동, 오른쪽 아래 버튼으로 회피</div>
  </div>
</section>

<section class="screen" id="select" hidden>
  <div class="sheet">
    <div><div class="eyebrow">각성자 선택</div><h2>누구와 밤을 넘길까</h2></div>
    <div class="heroes" id="heroes"></div>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" data-back>돌아가기</button>
      <button class="btn primary" id="startRun">시작</button>
    </div>
  </div>
</section>

<section class="screen" id="shop" hidden>
  <div class="sheet">
    <div class="row" style="justify-content:space-between;align-items:end">
      <div><div class="eyebrow">영구 강화</div><h2>엽전으로 몸을 단련한다</h2></div>
      <div class="purse">보유 엽전 <b id="sGold">0</b></div>
    </div>
    <div class="shop" id="shopList"></div>
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost" id="refund">모두 되돌리기</button>
      <button class="btn" data-back>돌아가기</button>
    </div>
  </div>
</section>

<section class="screen" id="levelup" hidden>
  <div class="sheet">
    <div><div class="eyebrow" id="luEyebrow">깨달음</div><h2 id="luTitle">하나를 고른다</h2></div>
    <div class="cards" id="luCards"></div>
    <div class="row" id="luFoot"></div>
  </div>
</section>

<section class="screen" id="pause" hidden>
  <div class="sheet">
    <div><div class="eyebrow">일시 정지</div><h2>숨을 고른다</h2></div>
    <div class="wrap-x"><table class="dmg" id="pauseBuild"></table></div>
    <div class="row">
      <button class="btn primary" id="resume">계속</button>
      <button class="btn" id="sndBtn2">소리 켜짐</button>
      <button class="btn ghost" id="giveUp">포기하고 나가기</button>
    </div>
  </div>
</section>

<section class="screen" id="result" hidden>
  <div class="sheet">
    <div><div class="eyebrow" id="rEyebrow">결과</div><h2 id="rTitle">쓰러졌다</h2></div>
    <p class="sub" id="rSub"></p>
    <div class="stats" id="rStats"></div>
    <div class="wrap-x"><table class="dmg" id="rDmg"></table></div>
    <div class="row">
      <button class="btn primary" id="again">다시 출정</button>
      <button class="btn" id="toTitle">처음으로</button>
    </div>
  </div>
</section>

<script src="game.js"></script>
