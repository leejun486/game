<!doctype html>

<body>
<canvas id="cv"></canvas>
<div id="ov"><button id="go">▶ 재생 (소리 켜짐)</button></div>
<div id="bar"><i></i></div>
<script src="place.js"></script>
<script>
'use strict';
/* =====================================================================
   식당 소개 OVA 셀 애니메이션 템플릿 (세로 9:16, 30초)
   window.PLACE (place.js, fetch_place.py 가 만든다) 의 정보로 장면을 그린다.
   그림·움직임·소리 모두 코드. render.js 가 이 페이지로 MP4 를 만든다.
   ===================================================================== */
const W = 720, H = 1280, DUR = 30, INK = '#0b0918', TAU = Math.PI * 2;
const FD = '"NanumMyeongjo","Nanum Myeongjo","Noto Serif KR","AppleMyungjo","Batang",serif';

const cv = document.getElementById('cv'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const scratch = mk(W, H), sctx = scratch.getContext('2d');
let BASE = null;

/* ---------- 데이터 ---------- */
const SAMPLE = { sample: true, name: '달빛 라멘', category: '라멘', area: '연남동', rating: 4.6, reviews: 1284, address: '서울 마포구 연남로 00 (예시 주소)', hours: '매일 11:30 – 23:00', menu: [{ name: '돈코츠 라멘', price: 11000 }, { name: '매운 미소 라멘', price: 12000 }, { name: '군만두 교자', price: 6000 }], quote: '국물이 진하고 밤늦게까지 열어서, 비 오는 날이면 생각나는 집이에요.', source: '예시 데이터' };
function normalize(r) {
  const s = v => (v == null ? '' : String(v)).trim();
  const p = {};
  p.sample = !!r.sample; p.name = s(r.name) || '이름 없는 식당'; p.category = s(r.category); p.area = s(r.area);
  p.rating = isFinite(+r.rating) && +r.rating > 0 ? Math.min(5, +r.rating) : null;
  p.reviews = isFinite(+r.reviews) && +r.reviews > 0 ? Math.round(+r.reviews) : null;
  p.address = s(r.address); p.hours = s(r.hours); p.source = s(r.source);
  p.menu = (Array.isArray(r.menu) ? r.menu : []).filter(m => m && s(m.name)).slice(0, 3).map(m => ({ name: s(m.name), price: m.price }));
  if (!p.menu.length) p.menu = [{ name: p.category || '오늘의 메뉴', price: '' }];
  p.quote = s(r.quote).slice(0, 90);

}
const P = normalize(window.PLACE_OVERRIDE || window.PLACE || SAMPLE);
const fmtPrice = v => (typeof v === 'number' || /^\d+$/.test(String(v))) ? Number(v).toLocaleString('ko-KR') + '원' : String(v || '');
const T_SIGN = 7.0, T_MENU = 11, HAS_RATE = !!(P.rating || P.quote), MENU_END = HAS_RATE ? 20 : 25, T_OUT = 25;

/* ---------- 수학 / 색 ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eo = t => 1 - Math.pow(1 - clamp(t), 3);
const eob = t => { t = clamp(t); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const fr = x => x - Math.floor(x);
const hash = n => fr(Math.sin(n * 127.1 + 311.7) * 43758.5453123);
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SEED = [...P.name].reduce((a, ch) => (a * 31 + ch.codePointAt(0)) | 0, 7);
const _hc = new Map();
function hex(c) { let v = _hc.get(c); if (v) return v; const n = parseInt(c.slice(1), 16); v = [n >> 16 & 255, n >> 8 & 255, n & 255]; _hc.set(c, v); return v; }
function mix(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${A[0] + (B[0] - A[0]) * t | 0},${A[1] + (B[1] - A[1]) * t | 0},${A[2] + (B[2] - A[2]) * t | 0})`; }
function rgba(c, a) { const A = hex(c); return `rgba(${A[0]},${A[1]},${A[2]},${clamp(a)})`; }
const ACCENTS = [['#d8432f', '#ffcf8a'], ['#2f6bd8', '#ffd98a'], ['#2a9d7a', '#ffe0a0'], ['#8a3fc2', '#ffc8a0']];
const [NOREN, WARM] = ACCENTS[Math.abs(SEED) % ACCENTS.length];

/* ---------- 그리기 도우미 ---------- */
function rrp(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r); c.lineTo(x + w, y + h - r);

}
function glow(c, x, y, r, col, a) {
  if (r <= 1 || a <= 0.002) return;
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(col, a)); g.addColorStop(0.3, rgba(col, a * 0.4)); g.addColorStop(1, rgba(col, 0));

}

}
function fullFill(c, st) { c.fillStyle = st; c.fillRect(-40, -40, W + 80, H + 80); }
function fitFont(c, text, maxW, size, fam, weight = '700', min = 18) {

  while (s > min && c.measureText(text).width > maxW) { s -= 2; c.font = `${weight} ${s}px ${fam}`; }
  return s;
}
function wrap(c, text, maxW) {
  const lines = []; let cur = '';

    if (c.measureText(cur + word).width <= maxW) { cur += word; continue; }
    if (cur.trim()) { lines.push(cur.trim()); cur = ''; }
    for (const ch of word) { if (c.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ''; } cur += ch; }
  }

}
function animeText(c, text, x, y, size, fam, fill, a = 1, weight = '700', align = 'center') {
  if (a <= 0.01) return;
  c.save(); c.globalAlpha = clamp(a); c.font = `${weight} ${size}px ${fam}`; c.textAlign = align; c.textBaseline = 'middle';
  c.lineJoin = 'round'; c.strokeStyle = INK; c.lineWidth = Math.max(4, size * 0.16); c.strokeText(text, x, y);
  c.fillStyle = fill; c.fillText(text, x, y); c.restore();
}

  c.save(); c.strokeStyle = rgba(o.col, o.a); c.lineWidth = o.lw; c.lineCap = 'round'; c.beginPath();
  for (let i = 0; i < o.n; i++) {
    const s = o.seed * 1000 + i, k = 0.75 + hash(s + .5) * 0.5;
    let x = hash(s) * Wd + vx * k * t, y = hash(s + .25) * Hd + vy * k * t;
    x = -120 + ((x % Wd) + Wd) % Wd; y = -80 + ((y % Hd) + Hd) % Hd;
    c.moveTo(x, y); c.lineTo(x - ux * o.len * k, y - uy * o.len * k);
  }
  c.stroke(); c.restore();
}
function ripples(c, t, y0, y1, a, n = 30) {
  c.save(); c.strokeStyle = '#b8c6ff'; c.lineWidth = 1.2;

    const x = hash(i * 7.7 + cyc * 1.3) * W, y = lerp(y0, y1, hash(i * 5.3 + cyc * 2.1)), k = 0.3 + 0.7 * clamp((y - y0) / (y1 - y0)), r = (5 + age * 30) * k;

}
function reflect(c, axis, t, alpha, top, bot) {
  if (axis >= H) return;
  sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.clearRect(0, 0, W, H); sctx.drawImage(c.canvas, 0, 0);
  c.save(); c.setTransform(BASE);
  const g = c.createLinearGradient(0, axis, 0, H); g.addColorStop(0, top); g.addColorStop(1, bot); c.fillStyle = g; c.fillRect(-40, axis, W + 80, H - axis + 40);
  c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = alpha;
  const ax = axis + BASE.f;
  for (let y = Math.max(0, Math.floor(ax)); y < H; y += 2) {
    const d = y - ax, sy = ax - d - 2; if (sy < 0) break;
    c.drawImage(scratch, 0, sy, W, 2, Math.sin(y * 0.13 + t * 4) * (0.6 + d * 0.015), y, W, 2);
  }

function steam(c, x, y, w, t, a) {
  c.save(); c.lineCap = 'round';
  for (let i = 0; i < 5; i++) {

    c.strokeStyle = `rgba(255,255,255,${a * Math.sin(ph * Math.PI) * 0.45})`; c.lineWidth = 7 - ph * 3;

/* ---------- 미리 그리는 배경 ---------- */
let FAR, LWALL, RWALL, GRAINS, VIG;
function makeFar() {
  const cv = mk(860, 520), c = cv.getContext('2d'), R = rng(SEED + 11); let x = 0;
  while (x < 860) {
    const bw = 40 + R() * 90, bh = 120 + R() * 360, top = 520 - bh;
    c.fillStyle = ['#12153a', '#161a42', '#101333'][(R() * 3) | 0]; c.fillRect(x, top, bw, bh);
    c.fillStyle = 'rgba(110,90,170,0.25)'; c.fillRect(x, top, bw, 2);
    for (let wy = top + 10; wy < 510; wy += 14) for (let wx = x + 6; wx < x + bw - 8; wx += 12) if (R() < 0.12) { c.fillStyle = ['#ffcf7a', '#9fe3ff', '#ffa070'][(R() * 3) | 0]; c.globalAlpha = 0.5 + R() * 0.5; c.fillRect(wx, wy, 5, 7); c.globalAlpha = 1; }
    if (R() < 0.3) { c.strokeStyle = '#0d1028'; c.lineWidth = 2; c.beginPath(); c.moveTo(x + bw / 2, top); c.lineTo(x + bw / 2, top - 30 - R() * 40); c.stroke(); }

  const g = c.createLinearGradient(0, 380, 0, 520); g.addColorStop(0, 'rgba(160,70,140,0)'); g.addColorStop(1, 'rgba(180,80,140,0.4)');
  c.globalCompositeOperation = 'lighter'; c.fillStyle = g; c.fillRect(0, 380, 860, 140);

}
function makeWall(side) {
  const w = 190, h = 820, cv = mk(w, h), c = cv.getContext('2d'), R = rng(SEED + (side ? 21 : 31));
  c.fillStyle = '#121430'; c.fillRect(0, 0, w, h);
  c.fillStyle = side ? 'rgba(90,80,160,0.22)' : 'rgba(0,0,10,0.3)'; c.fillRect(side ? 0 : w - 14, 0, 14, h);
  for (let i = 0; i < 7; i++) { const y = 30 + i * 110; c.fillStyle = R() < 0.35 ? '#ffcf7a' : '#1c2048'; c.globalAlpha = 0.85; c.fillRect(side ? 60 : 30, y, 70, 50); c.globalAlpha = 1; c.strokeStyle = INK; c.lineWidth = 3; c.strokeRect(side ? 60 : 30, y, 70, 50); }
  c.fillStyle = '#2a2d44'; for (let i = 0; i < 2; i++) { const y = 200 + i * 300; c.fillRect(side ? 10 : w - 70, y, 60, 40); c.strokeStyle = INK; c.lineWidth = 3; c.strokeRect(side ? 10 : w - 70, y, 60, 40); c.beginPath(); c.arc(side ? 40 : w - 40, y + 20, 13, 0, TAU); c.stroke(); }
  c.strokeStyle = '#2a2d44'; c.lineWidth = 6; c.beginPath(); c.moveTo(side ? 150 : 40, 0); c.lineTo(side ? 150 : 40, h); c.stroke();
  const signs = side ? ['노래방', '세탁'] : ['호프', '약국'], cols = side ? ['#ff4fa8', '#4ff0ff'] : ['#ffb03d', '#6dff9a'];
  signs.forEach((txt, k) => {
    const x = side ? 120 : 70, y = 120 + k * 330, n = [...txt].length;
    c.fillStyle = '#07081a'; c.fillRect(x - 22, y - 10, 44, n * 40 + 16); c.strokeStyle = INK; c.lineWidth = 3; c.strokeRect(x - 22, y - 10, 44, n * 40 + 16);
    c.save(); c.shadowColor = cols[k]; c.shadowBlur = 16; c.fillStyle = cols[k]; c.font = `700 30px ${FB}`; c.textAlign = 'center'; c.textBaseline = 'top';
    [...txt].forEach((ch, i) => c.fillText(ch, x, y + i * 40)); c.restore();

}
function prerender() {
  FAR = makeFar(); LWALL = makeWall(0); RWALL = makeWall(1);
  GRAINS = [0, 1, 2, 3].map(() => {
    const g = mk(360, 640), gc = g.getContext('2d'), id = gc.createImageData(360, 640), d = id.data;
    for (let p = 0; p < d.length; p += 4) { const v = Math.random() * 255; d[p] = d[p + 1] = d[p + 2] = v; d[p + 3] = 255; }
    gc.putImageData(id, 0, 0); return g;
  });
  VIG = mk(W, H); const vc = VIG.getContext('2d'), vg = vc.createRadialGradient(W / 2, H / 2, H * 0.25, W / 2, H / 2, H * 0.75);
  vg.addColorStop(0, 'rgba(0,0,8,0)'); vg.addColorStop(1, 'rgba(0,0,8,0.7)'); vc.fillStyle = vg; vc.fillRect(0, 0, W, H);
}

/* =====================================================================
   골목과 가게 앞모습
   ===================================================================== */
const signOn = t => t < T_SIGN ? 0 : t < T_SIGN + 0.7 ? (hash(Math.floor(t * 16) * 0.77) > 0.45 ? 1 : 0.15) : 1;
const lanternOn = t => ss(T_SIGN + 0.5, T_SIGN + 0.9, t);
function shopFront(c, t, sg, ln) {
  c.lineJoin = 'round'; c.strokeStyle = INK; c.lineWidth = 3;
  // 벽과 기둥
  c.fillStyle = '#2a2234'; c.fillRect(160, 570, 400, 360); c.strokeRect(160, 570, 400, 360);
  c.fillStyle = '#3d2c24'; for (const x of [160, 286, 420, 544]) { c.fillRect(x, 570, 16, 360); c.strokeRect(x, 570, 16, 360); }
  // 처마
  c.fillStyle = '#1b1d32'; c.beginPath(); c.moveTo(120, 588); c.lineTo(600, 588); c.lineTo(566, 520); c.lineTo(154, 520); c.closePath(); c.fill(); c.stroke();

  c.font = `800 ${fs}px ${FD}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = mix('#463830', '#26140c', sg); c.fillText(P.name, 360, 638);
  // 창문 (안쪽 손님 실루엣)
  for (const [wx, guests] of [[182, 2], [436, 1]]) {
    const ww = 104, wy = 694, wh = 176;
    const g = c.createLinearGradient(0, wy, 0, wy + wh); g.addColorStop(0, '#ffe2a6'); g.addColorStop(1, '#e8924a');
    c.fillStyle = g; c.fillRect(wx, wy, ww, wh);
    c.fillStyle = '#5a3020'; for (let k = 0; k < guests; k++) { const gx = wx + 30 + k * 46, gy = wy + 110 + Math.sin(t * 1.3 + k * 2) * 2; c.beginPath(); c.arc(gx, gy, 14, 0, TAU); c.fill(); c.beginPath(); c.ellipse(gx, gy + 40, 24, 22, 0, Math.PI, 0); c.fill(); }

  c.fillStyle = dg; c.fillRect(302, 690, 118, 240); c.strokeRect(302, 690, 118, 240);
  glow(c, 361, 860, 160, '#ffb860', 0.3);
  const sway = Math.sin(Math.floor(t * 12) / 12 * 1.7) * 3;
  for (let k = 0; k < 3; k++) {
    const x0 = 298 + k * 42;
    c.fillStyle = NOREN; c.beginPath(); c.moveTo(x0, 688); c.lineTo(x0 + 40, 688); c.lineTo(x0 + 40 + sway, 790); c.lineTo(x0 + sway * 0.6, 790); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = 'rgba(0,0,20,0.25)'; c.fillRect(x0 + 30, 690, 8, 98);
  }
  c.fillStyle = '#f4eee0'; c.beginPath(); c.arc(361 + sway * 0.5, 738, 30, 0, TAU); c.fill(); c.stroke();
  c.fillStyle = NOREN; c.font = `800 34px ${FD}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText([...P.name][0], 361 + sway * 0.5, 740);
  // 화분
  for (const px of [272, 452]) { c.fillStyle = '#3a2a3a'; c.beginPath(); c.moveTo(px - 18, 900); c.lineTo(px + 18, 900); c.lineTo(px + 13, 930); c.lineTo(px - 13, 930); c.closePath(); c.fill(); c.stroke(); c.fillStyle = '#1f4a3a'; for (let k = -2; k <= 2; k++) { c.beginPath(); c.ellipse(px + k * 8, 884 - Math.abs(k) * -4, 7, 20, k * 0.35, 0, TAU); c.fill(); } }
  // 등롱
  c.strokeStyle = INK; c.lineWidth = 2; c.beginPath(); c.moveTo(150, 590); c.lineTo(150, 640); c.stroke();
  const lsw = Math.sin(t * 1.4) * 0.05;
  c.save(); c.translate(150, 640); c.rotate(lsw);
  c.fillStyle = mix('#5a2020', '#ff6a4a', ln); c.beginPath(); c.ellipse(0, 50, 34, 48, 0, 0, TAU); c.fill(); c.lineWidth = 3; c.stroke();
  c.strokeStyle = rgba('#2a0a0a', 0.6); c.lineWidth = 1.5; for (let k = 1; k < 6; k++) { const yy = 2 + k * 16; const hw = 34 * Math.sqrt(1 - Math.pow((yy - 50) / 48, 2)); c.beginPath(); c.moveTo(-hw, yy); c.lineTo(hw, yy); c.stroke(); }
  c.fillStyle = '#1a1010'; c.fillRect(-14, -2, 28, 8); c.fillRect(-14, 94, 28, 8);

  t0 = AC.currentTime + 0.15; buildAudio(AC, AC.destination, t0);
  playing = true; ov.classList.add('hide');
}
function loop() {
  requestAnimationFrame(loop);
  if (!playing) return;
  const T = AC.currentTime - t0;
  if (T >= DUR) { playing = false; frame(DUR - 0.001); ov.classList.remove('hide'); document.getElementById('go').textContent = '↺ 다시 보기'; return; }
  frame(Math.max(0, T)); barI.style.width = (T / DUR * 100) + '%';
}
document.getElementById('go').onclick = play;
cv.onclick = () => { if (AC && playing) AC.state === 'running' ? AC.suspend() : AC.resume(); };

prerender();
const qs = new URLSearchParams(location.search);
if (qs.has('render')) ov.classList.add('hide');
document.fonts.load(`800 40px ${FD}`).then(() => document.fonts.load(`700 40px ${FB}`)).catch(() => { }).then(() => {
  frame(qs.has('still') ? parseFloat(qs.get('still')) : 9.5);
  window.__ready = true;
});
window.__frame = frame; window.__cv = cv; window.__renderAudio = renderAudioWav; window.__DUR = DUR;
requestAnimationFrame(loop);
</script>
